<!DOCTYPE html>

<html>
<head>
				<meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
				<link rel="stylesheet" href="styles/style.css"/>
				<title>My Portfolio</title>
</head>
<body>
				<nav class="navbar">
        <div class="logo">
        				<img src="images/logo.jpg">
        </div>
        <ul class="nav-links">
            <li><a href="#hero">Home</a></li>
            <li><a href="#project-grid">Work</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
				
				<header id="hero" class="hero-section">
        <h1>Hi, I'm <span class="highlight">Maluba</span>.</h1>
        <p>A Creative Developer building digital experiences.</p>
        <a href="#project-grid" class="btn hero-btn">View My Work</a>
    </header>
				
				<section id="portfolio-section">
    <h2>My Work</h2>
    <div id="project-grid" class="grid-container">
        </div>
</section>
				
				<section id="contact">
    <h2>Get In Touch</h2>
    <form action="https://formspree.io/f/mlgwglvj" method="POST" id="contact-form">
        <label>
            Your email:
            <input type="email" name="email" required placeholder="email@example.com">
        </label>
        <label>
            Your message:
            <textarea name="message" required placeholder="Hi, I'd love to work with you!"></textarea>
        </label>
        <button type="submit" class="btn">Send Message</button>
    </form>
</section>
				
				<footer class="social-contact">
        <h2>Let's connect.</h2>
        
        <div class="socials">
            <a href="#">LinkedIn</a> | <a href="#">GitHub</a> | <a href="#">Twitter</a>
        </div>
    </footer>
				
				<script src="scripts/script.js"></script>
</body>
</html>
